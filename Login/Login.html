<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Start - Đăng nhập</title>
    <link rel="stylesheet" href="./Login.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="login-container">
    <div class="left-side">
        <div class="content-left">
            <h1>Little Start <span class="star">★</span></h1>
            <div class="illustration">
                <img src="https://cdn-icons-png.flaticon.com/512/628/628283.png">
            </div>
            <p>Nơi ươm mầm tương lai</p>
        </div>
    </div>

    <div class="right-side">
        <div class="form-box">
            <h2>Đăng nhập</h2>
            <p class="subtitle">Chào mừng bạn trở lại hệ thống</p>

            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="username" placeholder="example@gmail.com">
                    <div class="error" id="userError"></div>
                </div>

                <div class="input-group">
                    <label>Mật khẩu</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="**********">
                        <span class="toggle-password" id="togglePass">🙈</span>
                    </div>
                    <div class="error" id="passError"></div>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox" id="remember"> Ghi nhớ tôi
                    </label>
                    <a href="#" class="forgot-pass">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-login">Đăng nhập</button>
            </form>
        </div>
    </div>
</div>

<script>
let users = [];

// ===== Load JSON (cùng thư mục Login) =====
fetch("./users.json")
    .then(res => res.json())
    .then(data => {
        users = data;
    })
    .catch(err => {
        console.error("Không load được users.json", err);
    });

// ===== Show / Hide password =====
const togglePass = document.getElementById("togglePass");
const passwordInput = document.getElementById("password");

togglePass.addEventListener("click", () => {
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePass.textContent = "👁️";
    } else {
        passwordInput.type = "password";
        togglePass.textContent = "🙈";
    }
});

// ===== Remember username =====
window.onload = function() {
    const savedUser = localStorage.getItem("rememberUser");
    if (savedUser) {
        document.getElementById("username").value = savedUser;
        document.getElementById("remember").checked = true;
    }
};

// ===== Login =====
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    let isValid = true;

    document.getElementById("userError").textContent = "";
    document.getElementById("passError").textContent = "";

    // ===== Validate email =====
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (username === "") {
        document.getElementById("userError").textContent = "Không được để trống!";
        isValid = false;
    } else if (!emailRegex.test(username)) {
        document.getElementById("userError").textContent = "Email không hợp lệ!";
        isValid = false;
    }

    if (password === "") {
        document.getElementById("passError").textContent = "Không được để trống!";
        isValid = false;
    } else if (password.length < 6) {
        document.getElementById("passError").textContent = "Mật khẩu ≥ 6 ký tự!";
        isValid = false;
    }

    if (!isValid) return;

    // ===== Check login =====
    const user = users.find(u => 
        u.username === username && u.password === password
    );

    if (user) {
        // remember
        if (document.getElementById("remember").checked) {
            localStorage.setItem("rememberUser", username);
        } else {
            localStorage.removeItem("rememberUser");
        }

        localStorage.setItem("role", user.role);

        // redirect
        if (user.role === "giaovien") {
            window.location.href = "../Dashboard/DB_GV.html";
        } else if (user.role === "bgh") {
            window.location.href = "../Dashboard/DB_BGH.html";
        } else if (user.role === "admin") {
            window.location.href = "../Dashboard/DB_Admin.html";
        } else if (user.role === "taivu") {
            window.location.href = "../Dashboard/DB_TV.html";
        } else if (user.role === "phuhuynh") {
            window.location.href = "../Dashboard/DB_PH.html";
        }
    } else {
        document.getElementById("passError").textContent = "Sai email hoặc mật khẩu!";
    }
});
</script>

</body>
</html>
